name: Update VirusTotal reports

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [github-pages]
    paths:
      - .github/workflows/virustotal.yml
      - .github/scripts/update-virustotal.mjs
      - .github/scripts/virustotal.test.mjs
      - releases.json

permissions:
  contents: read

concurrency:
  group: virustotal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create updater App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VT_APP_ID }}
          private-key: ${{ secrets.VT_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: github-pages
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test updater
        run: node --test .github/scripts/virustotal.test.mjs
      - name: Fetch current VirusTotal analyses
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: node .github/scripts/update-virustotal.mjs releases.json virustotal.json
      - name: Persist refreshed reports
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { readFileSync } = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const contents = readFileSync('virustotal.json');
            const previous = execFileSync('git', ['show', 'HEAD:virustotal.json']);
            if (contents.equals(previous)) {
              core.info('VirusTotal results are unchanged.');
              return;
            }
            const expectedHeadOid = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const result = await github.graphql(`
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid signature { isValid } }
                }
              }
            `, {
              input: {
                branch: { repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`, branchName: 'github-pages' },
                expectedHeadOid,
                message: { headline: 'Update VirusTotal reports' },
                fileChanges: { additions: [{ path: 'virustotal.json', contents: contents.toString('base64') }] }
              }
            });
            const commit = result.createCommitOnBranch.commit;
            if (!commit.signature?.isValid) throw new Error('GitHub did not return a verified commit signature.');
            core.info(`Saved VirusTotal results in verified commit ${commit.oid}.`);
