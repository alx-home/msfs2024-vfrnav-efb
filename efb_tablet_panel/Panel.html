<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Cockpit Tablet</title>
  <link rel="stylesheet" href="/SCSS/common.css" />
  <script src="/JS/coherent.js"></script>
  <script src="/JS/common.js"></script>
  <script src="/JS/Types.js"></script>
  <script src="/JS/simvar.js"></script>
  <script src="/JS/Services/ToolBarPanels.js"></script>
  <link rel="import" href="/templates/ingameUi/ingameUi.html" />
  <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />
  <style>
    html,
    body,
    efb-tablet-panel {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
    }

    ingame-ui {
      width: 100%;
      height: 100%;
    }

    efb-tablet-panel:not(.failed) ingame-ui {
      visibility: hidden;
      pointer-events: none;
    }
  </style>
  <script defer src="Panel.js"></script>
</head>

<body>
  <efb-tablet-panel>
    <ingame-ui panel-id="PANEL_COCKPIT_TABLET" title="Cockpit Tablet" class="ingameUiFrame panelInvisible"
      content-fit="true" min-width="250" min-height="120">
      <main style="padding: 16px">
        <button type="button">Show / hide cockpit tablet</button>
        <output role="status" style="display: block; margin-top: 12px">
          Ctrl+T by default. Change it in VFRNav EFB settings.
        </output>
      </main>
    </ingame-ui>
  </efb-tablet-panel>
</body>

</html>
