<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>MSFS Add-on - VirusTotal Security Reports</title>
   <style>
      :root {
         --bg: #0f172a;
         --card: #1e293b;
         --card-header: #162032;
         --text: #f8fafc;
         --muted: #94a3b8;
         --accent: #38bdf8;
         --border: #334155;
         --green: #22c55e;
      }

      body {
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background-color: var(--bg);
         color: var(--text);
         margin: 0;
         padding: 2rem 1rem;
         line-height: 1.6;
      }

      .container {
         max-width: 960px;
         margin: 0 auto;
      }

      header {
         display: flex;
         justify-content: space-between;
         align-items: center;
         flex-wrap: wrap;
         gap: 1rem;
         border-bottom: 1px solid var(--border);
         padding-bottom: 1.5rem;
         margin-bottom: 2rem;
      }

      h1 {
         margin: 0;
         font-size: 1.5rem;
      }

      p.subtitle {
         margin: 0.25rem 0 0;
         color: var(--muted);
         font-size: 0.95rem;
      }

      select {
         background: var(--card);
         color: var(--text);
         border: 1px solid var(--border);
         padding: 0.5rem 1rem;
         border-radius: 6px;
         font-size: 0.95rem;
         cursor: pointer;
      }

      .release-card {
         background: var(--card);
         border: 1px solid var(--border);
         border-radius: 10px;
         margin-bottom: 1.75rem;
         overflow: hidden;
      }

      .release-header {
         background: var(--card-header);
         padding: 1rem 1.25rem;
         border-bottom: 1px solid var(--border);
         display: flex;
         justify-content: space-between;
         align-items: center;
      }

      .release-version {
         font-size: 1.15rem;
         font-weight: 700;
         color: var(--accent);
      }

      .release-date {
         font-size: 0.9rem;
         color: var(--muted);
      }

      table {
         width: 100%;
         border-collapse: collapse;
      }

      th,
      td {
         padding: 0.85rem 1.25rem;
         text-align: left;
         border-bottom: 1px solid var(--border);
      }

      th {
         color: var(--muted);
         font-weight: 600;
         font-size: 0.8rem;
         text-transform: uppercase;
         background: rgba(255, 255, 255, 0.02);
      }

      tr:last-child td {
         border-bottom: none;
      }

      .file-title {
         font-weight: 600;
         display: block;
      }

      .file-name {
         font-size: 0.8rem;
         color: var(--muted);
         font-family: monospace;
      }

      .badge {
         display: inline-block;
         background: rgba(34, 197, 94, 0.15);
         color: var(--green);
         padding: 0.25rem 0.6rem;
         border-radius: 999px;
         font-size: 0.85rem;
         font-weight: 600;
         white-space: nowrap;
      }

      .btn {
         display: inline-block;
         background: var(--accent);
         color: #0f172a;
         text-decoration: none;
         padding: 0.4rem 0.85rem;
         border-radius: 6px;
         font-weight: 600;
         font-size: 0.85rem;
         transition: opacity 0.2s;
         white-space: nowrap;
      }

      .btn:hover {
         opacity: 0.85;
      }

      code.hash {
         font-family: monospace;
         color: var(--muted);
         font-size: 0.85rem;
      }

      @media (max-width: 700px) {

         th:nth-child(3),
         td:nth-child(3) {
            display: none;
         }

         th,
         td {
            padding: 0.75rem;
         }
      }
   </style>
</head>

<body>

   <div class="container">
      <header>
         <div>
            <h1 id="ui-title">VirusTotal Security Verification</h1>
            <p class="subtitle" id="ui-subtitle">Official malware scan reports for all MSFS add-on components.</p>
         </div>
         <select id="lang-select" aria-label="Language">
            <option value="en">🇬🇧 English</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="es">🇪🇸 Español</option>
            <option value="pt">🇧🇷 Português</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="zh">🇨🇳 中文</option>
         </select>
      </header>

      <div id="releases-container"></div>
   </div>

   <script>
      const translations = {
         en: {
            title: "VirusTotal Security Verification",
            subtitle: "Official malware scan reports for all MSFS add-on components.",
            colComponent: "Component",
            colStatus: "Scan Result",
            colHash: "SHA-256",
            colLink: "Report",
            viewBtn: "View Scan",
            types: {
               installer: "Installer",
               installer_uncompressed: "Installer (Uncompressed)",
               server: "Server Program",
               community: "Community Package"
            }
         },
         fr: {
            title: "Vérification de sécurité VirusTotal",
            subtitle: "Rapports d'analyse antivirus officiels pour tous les composants de l'add-on MSFS.",
            colComponent: "Composant",
            colStatus: "Résultat",
            colHash: "SHA-256",
            colLink: "Rapport",
            viewBtn: "Voir l'analyse",
            types: {
               installer: "Installeur",
               installer_uncompressed: "Installeur (Décompressé)",
               server: "Programme serveur",
               community: "Package Community"
            }
         },
         de: {
            title: "VirusTotal-Sicherheitsüberprüfung",
            subtitle: "Offizielle Malware-Scanberichte für alle MSFS-Add-on-Komponenten.",
            colComponent: "Komponente",
            colStatus: "Scan-Ergebnis",
            colHash: "SHA-256",
            colLink: "Bericht",
            viewBtn: "Scan ansehen",
            types: {
               installer: "Installationsprogramm",
               installer_uncompressed: "Installationsprogramm (Entpackt)",
               server: "Serverprogramm",
               community: "Community-Paket"
            }
         },
         es: {
            title: "Verificación de seguridad VirusTotal",
            subtitle: "Informes oficiales de análisis de malware para todos los componentes del complemento MSFS.",
            colComponent: "Componente",
            colStatus: "Resultado",
            colHash: "SHA-256",
            colLink: "Informe",
            viewBtn: "Ver análisis",
            types: {
               installer: "Instalador",
               installer_uncompressed: "Instalador (Descomprimido)",
               server: "Programa servidor",
               community: "Paquete Community"
            }
         },
         pt: {
            title: "Verificação de Segurança VirusTotal",
            subtitle: "Relatórios oficiais de verificação de malware para todos os componentes do add-on MSFS.",
            colComponent: "Componente",
            colStatus: "Resultado",
            colHash: "SHA-256",
            colLink: "Relatório",
            viewBtn: "Ver análise",
            types: {
               installer: "Instalador",
               installer_uncompressed: "Instalador (Descompactado)",
               server: "Programa servidor",
               community: "Pacote Community"
            }
         },
         it: {
            title: "Verifica di sicurezza VirusTotal",
            subtitle: "Rapporti ufficiali di scansione malware per tutti i componenti dell'add-on MSFS.",
            colComponent: "Componente",
            colStatus: "Risultato",
            colHash: "SHA-256",
            colLink: "Rapporto",
            viewBtn: "Vedi scansione",
            types: {
               installer: "Programma di installazione",
               installer_uncompressed: "Programma di installazione (Decompresso)",
               server: "Programma server",
               community: "Pacchetto Community"
            }
         },
         ru: {
            title: "Проверка безопасности VirusTotal",
            subtitle: "Официальные отчеты о проверке на вирусы для всех компонентов дополнения MSFS.",
            colComponent: "Компонент",
            colStatus: "Результат",
            colHash: "SHA-256",
            colLink: "Отчет",
            viewBtn: "Открыть отчет",
            types: {
               installer: "Установщик",
               installer_uncompressed: "Установщик (распакованный)",
               server: "Серверная программа",
               community: "Пакет Community"
            }
         },
         zh: {
            title: "VirusTotal 安全验证",
            subtitle: "所有 MSFS 插件组件的官方恶意软件扫描报告。",
            colComponent: "组件",
            colStatus: "扫描结果",
            colHash: "SHA-256",
            colLink: "报告",
            viewBtn: "查看报告",
            types: {
               installer: "安装程序",
               installer_uncompressed: "安装程序（未压缩）",
               server: "服务器程序",
               community: "Community 社区包"
            }
         }
      };

      let releasesData = [];
      let currentLang = "en";

      function applyLanguage(lang) {
         currentLang = translations[lang] ? lang : "en";
         const t = translations[currentLang];
         document.getElementById("ui-title").textContent = t.title;
         document.getElementById("ui-subtitle").textContent = t.subtitle;
         document.getElementById("lang-select").value = currentLang;
         renderReleases();
      }

      function renderReleases() {
         const container = document.getElementById("releases-container");
         const t = translations[currentLang];
         container.innerHTML = "";

         releasesData.forEach(function (release) {
            const card = document.createElement("div");
            card.className = "release-card";

            let rowsHtml = "";
            release.scans.forEach(function (scan) {
               const label = t.types[scan.type] || scan.type;
               const fileNameHtml = scan.filename ? '<span class="file-name">' + scan.filename + '</span>' : "";

               rowsHtml +=
                  '<tr>' +
                  '<td><span class="file-title">' + label + '</span>' + fileNameHtml + '</td>' +
                  '<td><span class="badge">' + scan.score + '</span></td>' +
                  '<td><code class="hash" title="' + scan.sha256 + '">' + scan.sha256.substring(0, 14) + '...</code></td>' +
                  '<td><a class="btn" href="' + scan.url + '" target="_blank" rel="noopener noreferrer">' + t.viewBtn + '</a></td>' +
                  '</tr>';
            });

            card.innerHTML =
               '<div class="release-header">' +
               '<span class="release-version">' + release.version + '</span>' +
               '<span class="release-date">' + release.date + '</span>' +
               '</div>' +
               '<table>' +
               '<thead>' +
               '<tr>' +
               '<th>' + t.colComponent + '</th>' +
               '<th>' + t.colStatus + '</th>' +
               '<th>' + t.colHash + '</th>' +
               '<th>' + t.colLink + '</th>' +
               '</tr>' +
               '</thead>' +
               '<tbody>' +
               rowsHtml +
               '</tbody>' +
               '</table>';

            container.appendChild(card);
         });
      }

      const userLang = navigator.language.slice(0, 2);
      if (translations[userLang]) {
         currentLang = userLang;
      }

      document.getElementById("lang-select").addEventListener("change", function (e) {
         applyLanguage(e.target.value);
      });

      fetch("releases.json")
         .then(function (res) { return res.json(); })
         .then(function (data) {
            releasesData = data;
            applyLanguage(currentLang);
         })
         .catch(function (err) {
            console.error("Erreur lors du chargement de releases.json :", err);
         });
   </script>

</body>

</html>
